[project]
name = "calle-python-compliance-gated-callback"
version = "0.0.0"
description = "Fail-closed, per-jurisdiction compliance gate for CALL-E outbound callback agents."
requires-python = ">=3.10"
dependencies = [
  # zoneinfo (used by compliance/time_utils.py for calling-window checks)
  # has no bundled tz database on Windows; this supplies it. Harmless no-op
  # on platforms that already ship system tzdata (Linux, macOS).
  "tzdata; platform_system == 'Windows'",
]

[dependency-groups]
dev = [
  "pytest>=9.0.0",
]
